sentence=Arduino library for Sensirion SHT40 I2C temperature and humidity sensors.
paragraph=Driver for Sensirion SHT40 digital relative humidity and temperature sensors. Features hardware CRC-8 data integrity checks, configurable precision modes, full on-chip pulsed heater control for de-condensation/diagnostics, 32-bit unique serial number readout, and software reset. Highly optimized for memory-constrained platforms including AVR, ESP8266, ESP32, STM32, and RP2040.
